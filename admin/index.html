<style>
html{ color-scheme:dark; }
.adm{ padding:104px 0 140px; }

.nav{ gap:14px; }
.nav-tag{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent); border:1px solid var(--line); padding:2px 7px; margin-left:4px;
}
.nav .btn{ padding:9px 16px; font-size:12px; }

.state{
  display:flex; align-items:center; gap:9px; min-width:0;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
}
.state i{ width:7px; height:7px; background:var(--line-hi); flex:none; }
.state span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.state a{ color:var(--accent); white-space:nowrap; }
.state.dirty{ color:var(--amber); } .state.dirty i{ background:var(--amber); }
.state.ok{ color:var(--mid); } .state.ok i{ background:#5fd39a; }
.state.bad{ color:#ff9daa; } .state.bad i{ background:#ff6b7d; }
.state.busy i{ background:var(--accent); animation:blink .9s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:.2 } }

.tabs{ display:flex; margin-bottom:clamp(34px,5vw,56px); overflow-x:auto; scrollbar-width:none; width:max-content; max-width:100%; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:none; }

.lead{ color:var(--mid); font-size:14px; line-height:1.85; max-width:66ch; margin:-8px 0 26px; }

.add{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:26px; }
.add .field{ flex:1; min-width:min(100%, 300px); margin:0; }
.add .btn{ height:44px; }

.field select{
  width:100%; padding:11px 34px 11px 12px;
  background:var(--void); border:1px solid var(--line); color:var(--star);
  font-family:var(--mono); font-size:13px; border-radius:0;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%;
  background-size:5px 5px; background-repeat:no-repeat;
}
.field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(224,102,74,.22); }
.field input, .field textarea{ border-radius:0; }
.note{ display:block; font-size:12px; line-height:1.7; color:var(--ghost); margin-top:7px; }

.sq{
  width:34px; height:34px; display:grid; place-items:center; flex:none;
  border:1px solid var(--line); background-color:var(--panel); color:var(--mid); cursor:pointer;
  background-image:linear-gradient(var(--accent), var(--accent));
  background-repeat:no-repeat; background-position:0 100%; background-size:100% 0;
  transition:background-size .3s var(--ease), color .2s, border-color .2s;
}
.sq:hover{ background-size:100% 100%; color:var(--void); border-color:var(--accent); }
.sq:disabled{ opacity:.35; pointer-events:none; }
.sq svg{ display:block; }

.seg{ display:flex; border:1px solid var(--line); background:var(--panel); flex:none; }
.seg button{
  padding:7px 10px; background:none; border:0; cursor:pointer;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  transition:color .2s, background .2s;
}
.seg button + button{ border-left:1px solid var(--line); }
.seg button:hover{ color:var(--star); }
.seg button.on{ color:var(--void); background:var(--accent); }

.rows{ display:flex; flex-direction:column; gap:12px; }
.card.row{
  display:grid; grid-template-columns:24px 92px minmax(0,1fr) auto;
  gap:18px; align-items:center; padding:12px 18px 12px 4px;
}
.card.row:hover{ border-color:var(--line-hi); }
.card.row.off{ border-style:dashed; }
.card.row.off .row-pic, .card.row.off .card-title{ opacity:.45; }
.card.row.dragging{ opacity:.35; }
.card.row.mark-before{ border-top:2px solid var(--accent); }
.card.row.mark-after{ border-bottom:2px solid var(--accent); }
.grip{ align-self:stretch; display:grid; place-items:center; color:var(--ghost); cursor:grab; }
.grip:hover{ color:var(--star); }
.row-pic{ width:92px; aspect-ratio:1; background:repeating-linear-gradient(45deg,#0e0b1e 0 9px,#131029 9px 18px); border:1px solid var(--line-soft); overflow:hidden; }
.row-pic img{ width:100%; height:100%; object-fit:cover; }
.row-body{ min-width:0; }
.row-body .card-title{ -webkit-line-clamp:1; margin-bottom:2px; }
.row-meta{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ghost); margin-bottom:10px; }
.row-meta a{ color:var(--accent); margin-left:8px; }
.row-meta a:hover{ color:var(--star); }
.row-body .field{ margin:0; max-width:440px; }
.ctls{ display:flex; align-items:center; gap:6px; }

.reel-grid .vid{ cursor:default; }
.reel-grid .vid:hover{ border-color:var(--line-hi); background:var(--panel); }
.reel-grid .vid::after{ display:none; }
.vid.off{ border-style:dashed; }
.vid.off .vid-thumb{ opacity:.45; }
.vid.dragging{ opacity:.35; }
.vid.mark-before{ border-left:2px solid var(--accent); }
.vid.mark-after{ border-right:2px solid var(--accent); }
.vid-thumb{ cursor:grab; }
.vid-thumb video{ width:100%; height:100%; object-fit:cover; }
.vid-ctls{ position:absolute; top:8px; right:8px; z-index:4; display:flex; gap:4px; }
.vid-ctls .sq{ width:30px; height:30px; background-color:rgba(6,4,14,.86); }
.vid-body .field:last-child{ margin-bottom:0; }
.vid-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px; }
.file-path{ font-size:12px; color:var(--dim); word-break:break-all; margin-bottom:8px; }
.btn.small{ padding:8px 14px; font-size:11.5px; }

.panel{ max-width:820px; }
.split{ display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:clamp(22px,4vw,48px); align-items:start; }
.pic-col{ text-align:center; }
.pic-col img{ width:100%; height:auto; margin-bottom:16px; }

.facts.edit{ max-width:none; margin-bottom:12px; }
.facts.edit .fact{ position:relative; padding:10px 40px 12px 15px; }
.facts.edit input{
  display:block; width:100%; background:transparent; border:0; padding:0; color:var(--star);
  font-family:var(--mono); outline:none;
}
.facts.edit input:first-child{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--mid); margin-bottom:5px; }
.facts.edit input:nth-child(2){ font-size:16px; font-weight:700; }
.facts.edit input::placeholder{ color:var(--ghost); }
.facts.edit .fact:focus-within{ background:var(--panel-hi); }
.facts.edit .sq{ position:absolute; top:8px; right:8px; width:26px; height:26px; }

.skill-list .skill{ display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 13px; cursor:grab; }
.skill-list .skill:hover{ letter-spacing:.02em; }
.skill-list .skill button{ width:22px; height:22px; display:grid; place-items:center; background:none; border:0; color:var(--dim); cursor:pointer; }
.skill-list .skill button:hover{ color:var(--accent); }
.skill.dragging{ opacity:.35; }
.skill.mark-before{ box-shadow:-3px 0 0 var(--accent); }
.skill.mark-after{ box-shadow:3px 0 0 var(--accent); }

.soc{ display:grid; grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr); gap:14px; align-items:end; padding:16px 0; border-top:1px solid var(--line-soft); }
.soc:first-child{ border-top:0; padding-top:0; }
.soc:last-child{ padding-bottom:0; }
.soc .social{ cursor:default; }
.soc .social:hover{ background-size:100% 0; color:var(--mid); border-color:var(--line); }
.soc .field{ margin:0; }

.toggle-line{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding-top:6px; }
.toggle-line > span{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }

.empty{ border:1px dashed var(--line); padding:32px; text-align:center; color:var(--dim); font-size:13px; line-height:2; }

.toast{ display:flex; align-items:center; gap:16px; max-width:calc(100vw - 32px); }
.toast.show{ pointer-events:auto; }
.toast button{ background:none; border:0; padding:0; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }

.gate{ min-height:100vh; display:grid; place-items:center; padding:96px 0 48px; }
.gate .contact-form{ width:min(560px, 100%); }
.gate ol{ margin:0 0 24px; padding-left:20px; color:var(--mid); font-size:13px; line-height:1.85; }
.gate ol b{ color:var(--star); }
.gate ol a{ color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
.gate .form-status{ margin-top:12px; }

.loading{ min-height:100vh; display:grid; place-items:center; text-align:center; }
.loading p{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:16px; }
.loading .row-btns{ display:flex; gap:10px; justify-content:center; }

@media (max-width:820px){
  .split{ grid-template-columns:1fr; }
  .pic-col{ max-width:160px; text-align:left; }
}
@media (max-width:640px){
  .nav-tag{ display:none; }
  .state span{ display:none; }
  .state a{ display:none; }
  .nav .btn{ padding:9px 12px; }
  .card.row{ grid-template-columns:20px 64px minmax(0,1fr); gap:12px; padding-right:12px; }
  .row-pic{ width:64px; }
  .ctls{ grid-column:2 / -1; justify-content:flex-end; }
  .soc{ grid-template-columns:44px minmax(0,1fr); }
  .soc .field:last-child{ grid-column:2; }
}
</style>

    var pad = new Array(d + 2).join('  ');
    var end = new Array(d + 1).join('  ');
    if (v === null || v === undefined) return 'null';
    if (typeof v === 'string') return q(v);
    if (typeof v === 'number') return isFinite(v) ? String(v) : '0';
    if (typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) {
      if (!v.length) return '[]';
      var items = v.map(function (x) { return ser(x, d + 1); });
      var flat = v.every(function (x) { return x === null || typeof x !== 'object'; });
      var line = '[' + items.join(', ') + ']';
      if (flat && line.length <= 60 && line.indexOf('\n') < 0) return line;
      return '[\n' + pad + items.join(',\n' + pad) + '\n' + end + ']';
    }
    var keys = Object.keys(v).filter(function (k) { return v[k] !== undefined; });
    if (!keys.length) return '{}';
    var parts = keys.map(function (k) { return (IDENT.test(k) ? k : q(k)) + ': ' + ser(v[k], d + 1); });
    var simple = keys.every(function (k) { return v[k] === null || typeof v[k] !== 'object'; });
    var one = '{ ' + parts.join(', ') + ' }';
    if (d > 0 && simple && one.length + d * 2 <= 100 && one.indexOf('\n') < 0) return one;
    return '{\n' + pad + parts.join(d === 0 ? ',\n\n' + pad : ',\n' + pad) + '\n' + end + '}';
  }

  function output(c) { return 'window.CONFIG = ' + ser(clean(c), 0) + ';\n'; }

  function referenced() {
    var c = state.cfg, used = {};
    c.videos.forEach(function (v) {
      if (v.kind === 'file' && v.src) used[v.src] = true;
      if (v.poster) used[v.poster] = true;
    });
    if (c.profile.avatar) used[c.profile.avatar.split('?')[0]] = true;
    return Object.keys(state.uploads).filter(function (p) { return used[p]; });
  }

  function isDirty() {
    if (!state.cfg) return false;
    return referenced().length > 0 || output(state.cfg) !== state.origSer;
  }

  function fetchConfig(sha) {
    return gh('/contents/config.js?ref=' + sha).then(function (f) { return fromB64(f.content); });
  }

  function loadAll() {
    return gh('/git/ref/heads/' + BRANCH).then(function (ref) {
      var sha = ref.object.sha;
      return fetchConfig(sha).then(function (text) {

        state.cfg = cfg;
        state.baseSha = sha;
        state.origText = text;
        state.origSer = output(cfg);

  function proxies() {
    var p = state.cfg && state.cfg.options && state.cfg.options.proxies;
    return p && p.length ? p : ['roproxy.com', 'rotunnel.com'];
  }

  function rbx(sub, path) {
    return proxies().reduce(function (chain, host) {
      return chain.catch(function () {
        return fetch('https://' + sub + '.' + host + path, { credentials: 'omit' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      });
    }, Promise.reject(new Error('start')));
  }

  function fetchInfo(ids) {
    ids = ids.map(Number).filter(function (id) { return id > 0 && !state.info[id]; });
    if (!ids.length) return Promise.resolve();
    var chunks = [];
    for (var i = 0; i < ids.length; i += 40) chunks.push(ids.slice(i, i + 40));
    return Promise.all(chunks.map(function (part) {
      return Promise.all([
        rbx('games', '/v1/games?universeIds=' + part.join(',')).catch(function () { return null; }),
        rbx('thumbnails', '/v1/games/icons?universeIds=' + part.join(',') + '&size=150x150&format=Png&isCircular=false').catch(function () { return null; })
      ]).then(function (res) {
        var found = {};
        if (res[0] && res[0].data) res[0].data.forEach(function (g) {
          found[g.id] = true;
          state.info[g.id] = { name: g.name, rootPlaceId: g.rootPlaceId };
        });
        if (res[1] && res[1].data) res[1].data.forEach(function (t) {
          if (state.info[t.targetId] && t.state === 'Completed') state.info[t.targetId].icon = t.imageUrl;
        });
        part.forEach(function (id) {
          if (!found[id]) state.info[id] = res[0] ? { missing: true } : { failed: true };
        });
      });
    })).then(function () {
      var a = document.activeElement;
      if (state.section === 'games' && !(a && a.closest && a.closest('.rows'))) renderSection();
    });
  }

  function resolveGame(input) {
    var s = String(input).trim();
    var m = s.match(/creations\/experiences\/(\d+)/i);
    if (m) return Promise.resolve(Number(m[1]));
    m = s.match(/roblox\.com\/(?:[a-z-]+\/)?games\/(\d+)/i);
    if (m) return placeToUniverse(m[1]);
    if (!/^\d+$/.test(s)) return Promise.reject(new Error('Paste a Roblox game link or a number'));
    return rbx('games', '/v1/games?universeIds=' + s).then(function (r) {
      if (r && r.data && r.data.length) return Number(s);
      return placeToUniverse(s);
    }, function () { return placeToUniverse(s); });
  }

  function placeToUniverse(placeId) {
    return rbx('apis', '/universes/v1/places/' + placeId + '/universe').then(function (r) {
      if (!r || !r.universeId) throw new Error('No Roblox game found for that');
      return Number(r.universeId);
    }, function () { throw new Error('No Roblox game found for that'); });
  }

  function ytId(s) {
    s = String(s || '').trim();
    var m = s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
    if (m) return m[1];
    m = s.match(/^([\w-]{11})(?:$|[?&#])/);
    return m ? m[1] : '';
  }

  function fileUrl(p) { return state.previews[p.split('?')[0]] || ('../' + p); }

  function readB64(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = function () { rej(new Error('Could not read that file')); };
      r.readAsDataURL(file);
    });
  }

  function toPng(file, max) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * s));
        c.height = Math.max(1, Math.round(img.naturalHeight * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/png'));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
      img.src = url;
    });
  }

  function safeName(name) {
    return String(name).toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'file';

  function uniquePath(dir, name) {
    var taken = {};
    state.cfg.videos.forEach(function (v) { if (v.src) taken[v.src] = 1; if (v.poster) taken[v.poster] = 1; });
    Object.keys(state.uploads).forEach(function (p) { taken[p] = 1; });
    var dot = name.lastIndexOf('.');
    var base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
    var p = dir + name, n = 2;
    while (taken[p]) p = dir + base + '-' + (n++) + ext;
    return p;
  }

  function clearMarks() {

  function sortable(el, list, idx, axis, handleOnly, done) {
    el.addEventListener('dragstart', function (e) {
      state.drag = { list: list, from: idx };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(idx)); } catch (x) {}
    });
    el.addEventListener('dragend', function () {
      el.classList.remove('dragging');
      if (handleOnly) el.draggable = false;
      clearMarks();
      state.drag = null;
    });
    el.addEventListener('dragover', function (e) {
      if (!state.drag || state.drag.list !== list) return;
      e.preventDefault();
      var r = el.getBoundingClientRect();
      var after = axis === 'x' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      clearMarks();
      el.classList.add(after ? 'mark-after' : 'mark-before');
      el._after = after;
    });
    el.addEventListener('drop', function (e) {
      if (!state.drag || state.drag.list !== list) return;
      e.preventDefault();
      var from = state.drag.from;
      var to = idx + (el._after ? 1 : 0);
      if (to > from) to--;
      clearMarks();
      if (move(list, from, to)) done();
    });
  }

          type: 'text', value: v.id || '',
          oninput: function (e) { v.id = e.target.value.trim(); touch(); },
          onchange: function () {
            var old = thumb.querySelector('img, video');
            var next = videoThumb(v);
            if (old) old.remove();
            if (next) thumb.insertBefore(next, thumb.firstChild);
          }
        }));
      } else {
        source = h('div', { class: 'field' }, [
          h('span', { text: 'File' }),
          h('div', { class: 'file-path', text: v.src + (state.uploads[v.src] ? '  · uploads on publish' : '') }),
          h('div', { class: 'form-foot' }, [
            btn(v.poster ? 'Change cover' : 'Add cover', {
              small: true,
              onclick: function () {
                pickFile('image/png,image/jpeg,image/webp', function (file) {
                  if (file.size > MAX_IMAGE) { toast('That image is over 10 MB'); return; }
                  var base = v.src.split('/').pop().replace(/\.[^.]+$/, '');
                  var ext = (file.name.match(/\.[a-z0-9]+$/i) || ['.jpg'])[0].toLowerCase();
                  var path = uniquePath('assets/videos/', base + '-cover' + ext);
                  readB64(file).then(function (b64) {
                    state.uploads[path] = { b64: b64 };
                    state.previews[path] = URL.createObjectURL(file);
                    v.poster = path;
                    renderSection();
                    touch();
                  }, function (err) { toast(err.message); });
                });
              }
            }),
            v.poster ? btn('Use a frame', { small: true, onclick: function () { delete v.poster; renderSection(); touch(); } }) : null
          ])
        ]);
      }
      add(thumb, h('div', { class: 'vid-ctls' }, [
        sq('left', 'Move earlier', function () { if (move(c.videos, i, i - 1)) { renderSection(); touch(); } }, i === 0),
        sq('right', 'Move later', function () { if (move(c.videos, i, i + 1)) { renderSection(); touch(); } }, i === c.videos.length - 1),
        sq('x', 'Remove', function () { removeFrom(c.videos, i, v.title ? '“' + v.title + '”' : 'Clip'); })
      ]));
      add(el, [
        thumb,
        h('div', { class: 'vid-body' }, [
          field('Title', title),
          field('Description', area(v, 'desc', 'What it is and how you built it', 4)),
          source,
          field('Tags', tags),
          h('div', { class: 'vid-foot' }, [
            h('span', { class: 'row-meta', style: 'margin:0', text: v.hide ? 'Hidden' : 'On site' }),
            seg([['show', 'Show'], ['hide', 'Hide']], v.hide ? 'hide' : 'show', function (val) {
              if (val === 'hide') v.hide = true; else delete v.hide;
              renderSection(); touch();
            })
          ])
        ])
      ]);
      grid.appendChild(el);
    });
    if (!c.videos.length) grid.appendChild(h('div', { class: 'reel-empty', text: 'No clips yet.' }));

    return [
      secHead('Projects', countText()),
      h('p', { class: 'lead', text: 'Paste a YouTube link, or upload an .mp4 or .webm under 50 MB. Uploaded files go up when you publish. Drag a thumbnail to reorder.' }),
      form, grid
    ];
  }

  function focusFirst(sel) {
    setTimeout(function () { var n = document.querySelector(sel); if (n) { n.focus(); n.scrollIntoView({ block: 'center' }); } }, 0);
  }

  function secProfile() {
    var p = state.cfg.profile;
    var facts = h('div', { class: 'facts edit' });
    p.facts.forEach(function (f, i) {
      add(facts, h('div', { class: 'fact' }, [
        input(f, 'label', 'Label'),
        input(f, 'value', 'Value'),
        sq('x', 'Remove fact', function () { removeFrom(p.facts, i, 'Fact'); })
      ]));
    });

    return [
      secHead('Profile'),
      h('div', { class: 'split' }, [
        h('div', { class: 'pic-col' }, [
          h('img', { src: avatarSrc(), alt: 'Your picture' }),
          btn('Change picture', {
            small: true,
            onclick: function () {
              pickFile('image/png,image/jpeg,image/webp', function (file) {
                if (file.size > MAX_IMAGE) { toast('That image is over 10 MB'); return; }
                toPng(file, 640).then(function (url) {
                  state.uploads['assets/pfp.png'] = { b64: url.split(',')[1] };
                  state.previews['assets/pfp.png'] = url;
                  p.avatar = 'assets/pfp.png?v=' + Date.now().toString(36);
                  renderSection();
                  var m = $('mark-img');
                  if (m) m.src = url;
                  touch();
                }, function (err) { toast(err.message); });
              });
            }
          }),
          h('small', { class: 'note', text: 'Also the tab icon.' })
        ]),
        h('div', { class: 'contact-form' }, [
          h('div', { class: 'field-row' }, [
            field('Username', input(p, 'username', 'pomatthew')),
            field('Role', input(p, 'role', 'Gameplay Programmer'))
          ]),
          field('About you', area(p, 'blurb', 'A few sentences about what you do', 5)),
          h('div', { class: 'field' }, [h('span', { text: 'Facts' })]),
          facts,
          btn('Add fact', {
            small: true,
            onclick: function () {
              p.facts.push({ label: '', value: '' });
              renderSection();
              touch();
              focusFirst('.facts.edit .fact:last-child input');
            }
          })
        ])
      ])
    ];
  }

  function secSkills() {
    var s = state.cfg.skills;
    var list = h('ul', { class: 'skill-list' });
    s.forEach(function (k, i) {
      var chip = h('li', { class: 'skill', draggable: 'true' }, [
        h('span', { text: k }),
        h('button', { type: 'button', title: 'Remove ' + k, 'aria-label': 'Remove ' + k, onclick: function () { removeFrom(s, i, '“' + k + '”'); } }, [svg(LINES.x, 12)])
      ]);
      sortable(chip, s, i, 'x', false, function () { renderSection(); touch(); });
      list.appendChild(chip);
    });
    if (!s.length) list.appendChild(h('li', { class: 'note', text: 'No skills yet.' }));
    var box = h('input', { type: 'text', placeholder: 'Luau, Blender, …' });
    var form = h('form', {
      class: 'add',
      onsubmit: function (e) {
        e.preventDefault();
        var added = 0;
        box.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean).forEach(function (t) {
          if (s.some(function (x) { return x.toLowerCase() === t.toLowerCase(); })) return;
          s.push(t);
          added++;
        });
        if (!added) { if (box.value.trim()) toast('Already on your list'); return; }
        renderSection();
        touch();
        focusFirst('#sec form.add input');
      }
    }, [field('Add skills', box), btn('Add', { solid: true, arrow: true, submit: true })]);

    return [
      secHead('Skills', countText()),
      h('p', { class: 'lead', text: 'Add several at once with commas. Drag a skill to move it.' }),
      form, list
    ];
  }

  function brand(key, url) {
    var known = BRANDS[key];
    return h('span', { class: 'social' + (url ? '' : ' unset') }, known ? [svg(known, 18, true)] : [key.slice(0, 2).toUpperCase()]);
  }

  function secSocials() {
    var so = state.cfg.socials;
    var rows = Object.keys(so).map(function (k) {
      var s = so[k];
      var icon = brand(k, s.url);
      var url = h('input', {
        type: 'url', value: s.url || '', placeholder: k === 'discord' ? 'Optional' : 'https://…',
        oninput: function (e) { s.url = e.target.value; icon.classList.toggle('unset', !s.url); touch(); }
      });
      return h('div', { class: 'soc' }, [
        icon,
        field(SOCIAL_NAMES[k] || k, url),
        field('Handle', input(s, 'handle', '@handle'))
      ]);
    });
    return [
      secHead('Socials'),
      h('p', { class: 'lead', text: 'An empty link shows as a dashed icon. Discord works with just a handle: clicking it copies the handle.' }),
      h('div', { class: 'contact-form panel' }, rows)
    ];
  }

  function secContact() {
    var c = state.cfg.contact;
    return [
      secHead('Contact'),
      h('div', { class: 'contact-form panel' }, [
        field('Your email', input(c, 'to', 'you@example.com', 'email')),
        field('Delivery', select(c, 'mode', [['formsubmit', 'Straight to my inbox (FormSubmit)'], ['mailto', 'Open the visitor’s mail app']], 'formsubmit'),
          'FormSubmit emails you a confirmation link the first time someone uses the form. Click it once and you’re set.'),
        field('Text beside the form', area(c, 'blurb', 'Contact me for…', 3))
      ])
    ];
  }

  function secSettings() {
    var o = state.cfg.options;
    var prox = h('input', {
      type: 'text', value: (o.proxies || []).join(', '),
      oninput: function (e) { o.proxies = e.target.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean); touch(); }
    });
    return [
      secHead('Settings'),
      h('p', { class: 'lead', text: 'How the site behaves. The defaults are fine.' }),
      h('div', { class: 'contact-form panel' }, [
        h('div', { class: 'toggle-line' }, [h('span', { text: 'Games open as' }),
          seg([['globe', 'Globe'], ['grid', 'Grid']], o.defaultGameView || 'globe', function (v) { o.defaultGameView = v; renderSection(); touch(); })]),
        h('div', { class: 'toggle-line', style: 'margin:14px 0 22px' }, [h('span', { text: 'Nebula background' }),
          seg([['on', 'On'], ['off', 'Off']], o.nebula === false ? 'off' : 'on', function (v) { o.nebula = v === 'on'; renderSection(); touch(); })]),
        h('div', { class: 'field-row' }, [
          field('Player count refresh (sec)', num(o, 'refreshSeconds', 5, 0), '0 turns it off.'),
          field('Stars', num(o, 'starCount', 20, 0), 'Fewer is faster on old phones.')
        ]),
        h('div', { class: 'field-row' }, [
          field('Max pixel ratio', num(o, 'maxPixelRatio', 0.25, 0.5), 'Lower is faster on sharp screens.'),
          field('Roblox proxies', prox, 'Tried in order. Comma separated.')
        ])
      ])
    ];
  }

  function setStatus(text, kind, link) {
    var s = $('state');
    if (!s) return;
    s.className = 'state' + (kind ? ' ' + kind : '');
    s.textContent = '';
    add(s, [h('i'), h('span', { text: text, title: text })]);
    if (link) add(s, h('a', { href: link.href, target: '_blank', rel: 'noopener', text: link.text }));
  }

  function updateStatus() {
    var pub = $('publish'), dis = $('discard');
    if (!pub) return;
    var d = isDirty();
    pub.disabled = !d || state.publishing;
    dis.disabled = !d || state.publishing;
    if (state.publishing) return;
    if (d) setStatus('Unpublished changes', 'dirty');
    else if (state.deploy) setStatus(state.deploy.text, state.deploy.kind, state.deploy.link);
    else setStatus('Matches the live site', '');
  }

  var discardArmed = null;
  function discard() {
    var label = $('discard').querySelector('span');
    if (!discardArmed) {
      label.textContent = 'Sure?';
      discardArmed = setTimeout(function () { discardArmed = null; label.textContent = 'Discard'; }, 3000);
      return;
    }
    clearTimeout(discardArmed);
    discardArmed = null;
    Object.keys(state.previews).forEach(function (k) { if (state.previews[k].indexOf('blob:') === 0) URL.revokeObjectURL(state.previews[k]); });
    state.cfg = normalize(parseConfig(state.origText));
    state.uploads = {};
    state.previews = {};
    renderApp();
    toast('Changes discarded');
  }

  function changedParts() {
    var now = clean(state.cfg), was = state.origCfg, out = [];
    var names = { games: 'games', videos: 'projects', profile: 'profile', skills: 'skills', socials: 'socials', contact: 'contact', options: 'settings' };
    Object.keys(names).forEach(function (k) {
      if (JSON.stringify(now[k]) !== JSON.stringify(was[k])) out.push(names[k]);
    });
    return out;
  }

  function publish() {
    if (state.publishing || !isDirty()) return;
    state.publishing = true;
    updateStatus();
    setStatus('Publishing', 'busy');
    var text = output(state.cfg);
    var paths = referenced();
    var parts = changedParts();
    if (paths.length) parts.push('files');
    var message = 'Update ' + (parts.length ? parts.join(', ') : 'site') + ' from admin';
    var head, newSha;

    Promise.resolve().then(function () {
      var check = parseConfig(text);
      if (JSON.stringify(check) !== JSON.stringify(clean(state.cfg))) throw new Error('Safety check failed, nothing was published');
      return gh('/git/ref/heads/' + BRANCH);
    }).then(function (ref) {
      head = ref.object.sha;
      if (head === state.baseSha) return;
      return fetchConfig(head).then(function (remote) {
        if (remote !== state.origText) {
          var e = new Error('config.js changed on GitHub after you opened this page. Copy anything you need, then reload.');
          e.conflict = true;
          throw e;
        }
      });
    }).then(function () {
      return gh('/git/commits/' + head);
    }).then(function (commit) {
      var tree = [];
      var chain = gh('/git/blobs', { method: 'POST', body: { content: text, encoding: 'utf-8' } }).then(function (b) {
        tree.push({ path: 'config.js', mode: '100644', type: 'blob', sha: b.sha });
      });
      paths.forEach(function (p, i) {
        chain = chain.then(function () {
          setStatus('Uploading file ' + (i + 1) + ' of ' + paths.length, 'busy');
          return gh('/git/blobs', { method: 'POST', body: { content: state.uploads[p].b64, encoding: 'base64' } });
        }).then(function (b) {
          tree.push({ path: p, mode: '100644', type: 'blob', sha: b.sha });
        });
      });
      return chain.then(function () {
        setStatus('Publishing', 'busy');
        return gh('/git/trees', { method: 'POST', body: { base_tree: commit.tree.sha, tree: tree } });
      });
    }).then(function (tree) {
      return gh('/git/commits', { method: 'POST', body: { message: message, tree: tree.sha, parents: [head] } });
    }).then(function (c) {
      newSha = c.sha;
      return gh('/git/refs/heads/' + BRANCH, { method: 'PATCH', body: { sha: newSha } });
    }).then(function () {
      state.baseSha = newSha;
      state.origText = text;
      state.origSer = text;
      state.origCfg = JSON.parse(JSON.stringify(parseConfig(text)));
      paths.forEach(function (p) { delete state.uploads[p]; });
      state.deploy = { text: 'Published, deploying', kind: 'busy' };
      state.publishing = false;
      updateStatus();
      toast('Published');
      watchDeploy(newSha);
    }).catch(function (e) {
      state.publishing = false;
      updateStatus();
      var msg = e.status === 401 ? 'GitHub rejected your token. Sign out and paste a new one.'
        : (e.status === 403 || e.status === 404) ? 'Your token can’t write to the repo. It needs Contents read and write.'
        : e.message;
      setStatus('Not published: ' + msg, 'bad', e.conflict ? { href: location.href, text: 'Reload' } : null);
      toast('Not published');
    });
  }

  function watchDeploy(sha) {
    var tries = 0;
    function done(text, kind, link) {
      if (state.baseSha !== sha) return;
      state.deploy = { text: text, kind: kind, link: link };
      updateStatus();
    }
    function tick() {
      if (state.baseSha !== sha) return;
      tries++;
      gh('/actions/runs?head_sha=' + sha + '&per_page=5').then(function (r) {
        var run = r && r.workflow_runs && r.workflow_runs[0];
        if (!run) {
          if (tries > 20) return done('Published, live in about a minute', 'ok');
          return setTimeout(tick, 4000);
        }
        if (run.status !== 'completed') {
          done('Published, deploying', 'busy');
          if (tries > 90) return done('Deploy is taking a while', 'dirty', { href: run.html_url, text: 'Check' });
          return setTimeout(tick, 4000);
        }
        if (run.conclusion === 'success') done('Live', 'ok', { href: SITE, text: 'Open ↗' });
        else done('Deploy failed', 'bad', { href: run.html_url || ('https://github.com/' + REPO + '/actions'), text: 'See why' });
      }, function () {
        done('Published, live in about a minute', 'ok');
      });
    }
    setTimeout(tick, 3000);
  }

  window.addEventListener('beforeunload', function (e) {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && state.cfg) {
      e.preventDefault();
      publish();
    }
  });

  if (token) boot(); else renderGate();
})();
</script>
<script src="../js/space.js"></script>
</body>
